<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithm Atlas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ============ tokens ============ */
:root {
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --surface-2: #EBEFF3;
  --ink: #1A2732;
  --muted: #5C6B78;
  --line: #D8DFE6;
  --accent: #0E8A74;
  --accent-soft: #0E8A741f;
  --accent-contrast: #FFFFFF;
  --c-compare: #DD9A1E;
  --c-active: #D6493F;
  --c-done: #2E9E63;
  --c-pointer: #3B76D8;
  --c-pivot: #8A5CD6;
  --c-range: #3B76D81a;
  --code-bg: #10161C;
  --code-ink: #D5DEE6;
  --code-muted: #6B7B88;
  --code-hl: #DD9A1E2e;
  --code-hl-bar: #DD9A1E;
  --shadow: 0 1px 2px rgba(16, 30, 40, .06), 0 8px 24px rgba(16, 30, 40, .07);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1519;
    --surface: #161E24;
    --surface-2: #1D2830;
    --ink: #E6EDF2;
    --muted: #8FA1AE;
    --line: #2A3843;
    --accent: #2FBFA4;
    --accent-soft: #2FBFA424;
    --accent-contrast: #0B1310;
    --c-compare: #E9B04A;
    --c-active: #E4685E;
    --c-done: #45B87C;
    --c-pointer: #6B98E8;
    --c-pivot: #A47FE4;
    --c-range: #6B98E81f;
    --code-bg: #0B1014;
    --code-ink: #C9D5DE;
    --code-muted: #5E7280;
    --code-hl: #E9B04A2b;
    --code-hl-bar: #E9B04A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  --bg: #0F1519;
  --surface: #161E24;
  --surface-2: #1D2830;
  --ink: #E6EDF2;
  --muted: #8FA1AE;
  --line: #2A3843;
  --accent: #2FBFA4;
  --accent-soft: #2FBFA424;
  --accent-contrast: #0B1310;
  --c-compare: #E9B04A;
  --c-active: #E4685E;
  --c-done: #45B87C;
  --c-pointer: #6B98E8;
  --c-pivot: #A47FE4;
  --c-range: #6B98E81f;
  --code-bg: #0B1014;
  --code-ink: #C9D5DE;
  --code-muted: #5E7280;
  --code-hl: #E9B04A2b;
  --code-hl-bar: #E9B04A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
}

/* ============ base ============ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  min-height: 100vh;
}
h1, h2, h3, h4 {
  font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}
button:focus-visible, input:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
code, .mono { font-family: "JetBrains Mono", ui-monospace, "Cascadia Code", Menlo, monospace; }

/* ============ shell ============ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  font-weight: 800;
  font-size: 19px;
  letter-spacing: -.01em;
}
.brand .compass { font-size: 20px; }
.brand small {
  font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
  font-weight: 400;
  font-size: 12.5px;
  color: var(--muted);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.topbar .spacer { flex: 1; }
.progress-pill {
  font-size: 13px;
  color: var(--muted);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 4px 12px;
  white-space: nowrap;
}
.progress-pill b { color: var(--accent); }
.icon-btn {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 16px;
}
.icon-btn:hover { border-color: var(--accent); }
#menuBtn { display: none; }

.shell { display: flex; min-height: calc(100vh - 57px); }

/* ============ sidebar ============ */
.sidebar {
  width: 264px;
  flex: 0 0 264px;
  border-right: 1px solid var(--line);
  background: var(--surface);
  padding: 18px 12px 32px;
  overflow-y: auto;
  max-height: calc(100vh - 57px);
  position: sticky;
  top: 57px;
}
.nav-cat {
  margin: 18px 6px 6px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}
.nav-cat:first-child { margin-top: 2px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  padding: 8px 10px;
  border-radius: 9px;
  font-size: 14.5px;
  color: var(--ink);
}
.nav-item:hover { background: var(--surface-2); }
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
}
.nav-item .check {
  margin-left: auto;
  font-size: 12px;
  color: var(--c-done);
  font-weight: 700;
}
.nav-item.planned {
  color: var(--muted);
  cursor: default;
}
.nav-item.planned:hover { background: none; }
.nav-item .soon {
  margin-left: auto;
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 1px 7px;
  color: var(--muted);
}
.backdrop { display: none; }

/* ============ main ============ */
.main {
  flex: 1;
  min-width: 0;
  padding: 26px clamp(16px, 3.5vw, 44px) 80px;
}
.crumb {
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.topic-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 16px;
  margin-bottom: 4px;
}
.topic-head h1 {
  font-size: clamp(26px, 3.4vw, 36px);
  font-weight: 800;
  letter-spacing: -.015em;
}
.done-btn {
  font-size: 13px;
  font-weight: 700;
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 6px 14px;
  color: var(--muted);
  background: var(--surface);
}
.done-btn.on {
  color: var(--c-done);
  border-color: var(--c-done);
  background: color-mix(in srgb, var(--c-done) 10%, transparent);
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
.chip {
  font-family: "JetBrains Mono", monospace;
  font-size: 12.5px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 11px;
  color: var(--ink);
}
.chip span { color: var(--muted); font-family: "Atkinson Hyperlegible", sans-serif; }

.about {
  max-width: 68ch;
  margin-bottom: 22px;
}
.about p { margin: 0 0 10px; }
.about .uses { color: var(--muted); font-size: 14.5px; }
.about .uses b { color: var(--ink); font-weight: 700; }

/* ============ workbench ============ */
.bench {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
  gap: 18px;
  align-items: start;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-h {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--muted);
}

/* input row */
.input-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.input-row label { font-size: 13px; color: var(--muted); font-weight: 700; }
.input-row input[type=text] {
  flex: 1;
  min-width: 140px;
  font-family: "JetBrains Mono", monospace;
  font-size: 13.5px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
.run-btn {
  font-weight: 700;
  font-size: 13.5px;
  background: var(--accent);
  color: var(--accent-contrast);
  border-radius: 8px;
  padding: 8px 16px;
}
.run-btn:hover { filter: brightness(1.08); }
.shuffle-btn {
  font-size: 13.5px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 12px;
  background: var(--surface);
}
.input-err {
  width: 100%;
  font-size: 13px;
  color: var(--c-active);
  display: none;
}
.input-err.show { display: block; }

/* stage */
.stage {
  padding: 22px 18px;
  min-height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: auto;
}
.stage svg { max-width: 100%; height: auto; }

/* array bars */
.bars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  width: 100%;
  max-width: 560px;
  height: 220px;
}
.bar-slot { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; min-width: 0; }
.bar {
  width: 100%;
  max-width: 52px;
  border-radius: 6px 6px 2px 2px;
  background: var(--c-pointer);
  opacity: .82;
  transition: height .18s ease, background-color .12s ease;
}
@media (prefers-reduced-motion: reduce) {
  .bar, * { transition: none !important; animation: none !important; }
}
.bar-slot.in-range .bar { opacity: 1; }
.bar-slot.compare .bar { background: var(--c-compare); opacity: 1; }
.bar-slot.swapped .bar { background: var(--c-active); opacity: 1; }
.bar-slot.pivot .bar { background: var(--c-pivot); opacity: 1; }
.bar-slot.sorted .bar { background: var(--c-done); opacity: 1; }
.bar-slot.dim .bar { opacity: .3; }
.bar-val {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}
.bar-slot.compare .bar-val, .bar-slot.swapped .bar-val, .bar-slot.pivot .bar-val, .bar-slot.sorted .bar-val { color: var(--ink); font-weight: 600; }

/* narration + transport */
.narrate {
  min-height: 46px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-top: 1px solid var(--line);
  font-size: 14.5px;
}
.narrate .dot {
  flex: 0 0 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c-compare);
}
.aux-strip {
  padding: 8px 16px 2px;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  display: none;
}
.aux-strip.show { display: block; }
.aux-strip b { color: var(--ink); font-weight: 600; }
.transport {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 16px 14px;
  border-top: 1px solid var(--line);
  background: var(--surface-2);
}
.t-btn {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 15px;
}
.t-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.t-btn:disabled { opacity: .38; cursor: default; }
.t-btn.play {
  width: 46px;
  background: var(--accent);
  color: var(--accent-contrast);
  border-color: var(--accent);
  font-size: 16px;
}
.t-btn.play:hover:not(:disabled) { color: var(--accent-contrast); filter: brightness(1.08); }
.speed-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 12.5px; color: var(--muted); }
.speed-wrap input[type=range] { width: 110px; accent-color: var(--accent); }
.step-count {
  font-family: "JetBrains Mono", monospace;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  min-width: 86px;
  text-align: right;
}

/* code panel */
.code-card { position: sticky; top: 75px; }
.code-card .card-h { background: var(--code-bg); color: var(--code-muted); border-bottom-color: color-mix(in srgb, var(--code-muted) 25%, transparent); }
.code-body {
  background: var(--code-bg);
  padding: 12px 0 14px;
  overflow-x: auto;
}
.code-line {
  display: flex;
  gap: 14px;
  padding: 1px 14px 1px 0;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  line-height: 1.75;
  color: var(--code-ink);
  white-space: pre;
  border-left: 3px solid transparent;
}
.code-line .ln {
  flex: 0 0 30px;
  text-align: right;
  color: var(--code-muted);
  user-select: none;
  font-variant-numeric: tabular-nums;
}
.code-line.hl {
  background: var(--code-hl);
  border-left-color: var(--code-hl-bar);
}
.code-line.hl .ln { color: var(--code-hl-bar); }

/* legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  padding: 10px 16px 0;
  font-size: 12.5px;
  color: var(--muted);
}
.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-right: 5px;
  vertical-align: baseline;
}

/* ============ quiz ============ */
.quiz { margin-top: 26px; }
.quiz .card-h { justify-content: space-between; text-transform: none; letter-spacing: 0; }
.quiz .card-h .qt { font-size: 15px; font-weight: 700; color: var(--ink); }
.quiz-score { font-size: 13px; color: var(--muted); font-weight: 400; }
.quiz-score.pass { color: var(--c-done); font-weight: 700; }
.q-block { padding: 16px; border-bottom: 1px solid var(--line); }
.q-block:last-child { border-bottom: none; }
.q-text { font-weight: 700; margin-bottom: 10px; }
.q-opts { display: grid; gap: 8px; }
.q-opt {
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 9px 13px;
  font-size: 14.5px;
  background: var(--surface);
}
.q-opt:hover:not(:disabled) { border-color: var(--accent); }
.q-opt:disabled { cursor: default; }
.q-opt.correct { border-color: var(--c-done); background: color-mix(in srgb, var(--c-done) 10%, transparent); font-weight: 700; }
.q-opt.wrong { border-color: var(--c-active); background: color-mix(in srgb, var(--c-active) 8%, transparent); }
.q-explain {
  margin-top: 10px;
  font-size: 13.5px;
  color: var(--muted);
  border-left: 3px solid var(--accent);
  padding: 2px 0 2px 12px;
  display: none;
}
.q-explain.show { display: block; }
.quiz-reset {
  font-size: 13px;
  color: var(--muted);
  text-decoration: underline;
  padding: 12px 16px;
}
.quiz-reset:hover { color: var(--accent); }

/* welcome view */
.welcome { max-width: 62ch; }
.welcome h1 { font-size: clamp(30px, 4vw, 42px); font-weight: 800; letter-spacing: -.02em; margin-bottom: 14px; }
.welcome .lede { font-size: 17.5px; }
.welcome ul { padding-left: 20px; color: var(--muted); }
.welcome li { margin: 6px 0; }
.welcome li b { color: var(--ink); }

/* svg shared */
.sv-edge { stroke: var(--line); stroke-width: 2.5; fill: none; }
.sv-edge.active { stroke: var(--c-compare); stroke-width: 3.5; }
.sv-edge.tread { stroke: var(--c-done); stroke-width: 3; }
.sv-node { fill: var(--surface-2); stroke: var(--line); stroke-width: 2; }
.sv-node.seen { stroke: var(--c-pointer); stroke-dasharray: 4 3; }
.sv-node.visited { fill: var(--c-done); stroke: var(--c-done); }
.sv-node.current { stroke: var(--c-compare); stroke-width: 3.5; fill: var(--surface); }
.sv-node.current.visited { fill: var(--c-done); }
.sv-label { font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.sv-node.visited + .sv-label, g.visited .sv-label { fill: #fff; }
.sv-small { font-family: "JetBrains Mono", monospace; font-size: 11px; fill: var(--muted); text-anchor: middle; }
.sv-ptr { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 600; text-anchor: middle; }
.sv-link { stroke: var(--c-pointer); stroke-width: 2.2; fill: none; }
.sv-link.flipped { stroke: var(--c-done); }
.sv-cell { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.6; rx: 9; }
.sv-cell.curr { stroke: var(--c-compare); stroke-width: 2.6; }
.sv-cell.newhead { stroke: var(--c-done); stroke-width: 2.6; }

/* ============ responsive ============ */
@media (max-width: 1060px) {
  .bench { grid-template-columns: 1fr; }
  .code-card { position: static; }
}
@media (max-width: 860px) {
  #menuBtn { display: grid; }
  .sidebar {
    position: fixed;
    left: 0;
    top: 57px;
    bottom: 0;
    z-index: 60;
    max-height: none;
    transform: translateX(-100%);
    transition: transform .22s ease;
    box-shadow: var(--shadow);
  }
  .sidebar.open { transform: translateX(0); }
  .backdrop {
    display: none;
    position: fixed;
    inset: 57px 0 0 0;
    z-index: 50;
    background: rgba(10, 16, 20, .45);
  }
  .backdrop.show { display: block; }
  .progress-pill { display: none; }
  .main { padding-top: 18px; }
}
</style>
</head>
<body>

<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="Open topic menu">☰</button>
  <div class="brand"><span class="compass">🧭</span> Algorithm Atlas <small>learn DSA by watching it run</small></div>
  <div class="spacer"></div>
  <div class="progress-pill" id="progressPill"></div>
  <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode">◐</button>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="DSA topics"></nav>
  <div class="backdrop" id="backdrop"></div>
  <main class="main" id="main"></main>
</div>

<script>
'use strict';

/* ================================================================
   Algorithm Atlas — an extensible DSA visualizer.

   To add a topic: call registerTopic({...}) with
     id, category, title, tagline, complexity {best,avg,worst,space},
     about (html), uses (html), code (array of source lines),
     inputs (spec for the custom-input row),
     makeSteps(parsedInput) -> [{line, desc, state}],
     renderer (one of the shared render functions, or your own),
     quiz [{q, opts, answer, why}]
   Everything else — playback, code highlighting, quizzes,
   progress tracking, navigation — is generic.
   ================================================================ */

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ---------------- persistence ---------------- */
const Store = {
  key: 'algorithmAtlas.v1',
  data: { theme: null, done: {} },
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) this.data = Object.assign(this.data, JSON.parse(raw));
    } catch (e) { /* private mode etc. */ }
  },
  save() {
    try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {}
  }
};
Store.load();

/* ---------------- theme ---------------- */
function applyTheme() {
  const t = Store.data.theme;
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}
function toggleTheme() {
  const cur = Store.data.theme ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

/* ---------------- input parsing ---------------- */
function parseNums(text, { min = 2, max = 12, allowDup = true } = {}) {
  const parts = String(text).split(/[\s,;]+/).filter(Boolean);
  if (parts.length < min) throw new Error(`Enter at least ${min} numbers, separated by commas.`);
  if (parts.length > max) throw new Error(`Keep it to ${max} numbers or fewer so the animation stays readable.`);
  const nums = parts.map(p => {
    const n = Number(p);
    if (!Number.isFinite(n) || !Number.isInteger(n)) throw new Error(`"${p}" is not a whole number.`);
    if (n < -999 || n > 999) throw new Error('Use values between -999 and 999.');
    return n;
  });
  if (!allowDup && new Set(nums).size !== nums.length) throw new Error('Please use distinct values for this topic.');
  return nums;
}

function parseGraph(text) {
  const pairs = String(text).split(/[,\n;]+/).map(s => s.trim()).filter(Boolean);
  if (!pairs.length) throw new Error('Enter edges like  A-B, A-C, B-D');
  const nodes = new Set();
  const edges = [];
  for (const p of pairs) {
    const m = p.match(/^([A-Za-z0-9]{1,3})\s*-\s*([A-Za-z0-9]{1,3})$/);
    if (!m) throw new Error(`"${p}" isn't an edge. Use the form  A-B  (letters or digits, max 3 chars).`);
    const u = m[1].toUpperCase(), v = m[2].toUpperCase();
    if (u === v) throw new Error(`"${p}" is a self-loop — use two different nodes.`);
    nodes.add(u); nodes.add(v);
    if (!edges.some(([a, b]) => (a === u && b === v) || (a === v && b === u))) edges.push([u, v]);
  }
  if (nodes.size > 10) throw new Error('Keep it to 10 nodes or fewer so the layout stays readable.');
  const adj = {};
  [...nodes].sort().forEach(n => adj[n] = []);
  for (const [u, v] of edges) { adj[u].push(v); adj[v].push(u); }
  for (const n in adj) adj[n].sort();
  return { nodes: [...nodes].sort(), edges, adj };
}

function randomArray(n = 8) {
  const out = [];
  while (out.length < n) {
    const v = 5 + Math.floor(Math.random() * 95);
    if (!out.includes(v)) out.push(v);
  }
  return out;
}

/* ================================================================
   Player — generic step engine shared by every topic
   ================================================================ */
const Player = {
  steps: [], idx: 0, timer: null, playing: false,
  renderer: null, stageEl: null, codeEl: null, narrateEl: null,
  auxEl: null, countEl: null, controls: {},

  load(steps, renderer) {
    this.stop();
    this.steps = steps;
    this.renderer = renderer;
    this.goTo(0);
  },
  goTo(i) {
    if (!this.steps.length) return;
    this.idx = Math.max(0, Math.min(i, this.steps.length - 1));
    const step = this.steps[this.idx];
    this.renderer(step.state, this.stageEl);
    this.paintCode(step.line);
    this.narrateEl.innerHTML = '<span class="dot"></span><span>' + step.desc + '</span>';
    if (this.auxEl) {
      const aux = step.state && step.state.aux;
      this.auxEl.classList.toggle('show', !!aux);
      if (aux) this.auxEl.innerHTML = aux;
    }
    this.countEl.textContent = `step ${this.idx + 1} / ${this.steps.length}`;
    this.syncButtons();
  },
  paintCode(line) {
    if (!this.codeEl) return;
    this.codeEl.querySelectorAll('.code-line').forEach((el, k) => {
      el.classList.toggle('hl', k + 1 === line);
    });
    const hl = this.codeEl.querySelector('.code-line.hl');
    if (hl) hl.scrollIntoView({ block: 'nearest', behavior: 'auto' });
  },
  delay() {
    const v = Number(this.controls.speed.value); // 1..10
    return 1450 - v * 130; // 1320ms .. 150ms
  },
  play() {
    if (this.idx >= this.steps.length - 1) this.goTo(0);
    this.playing = true;
    this.syncButtons();
    const tick = () => {
      if (!this.playing) return;
      if (this.idx >= this.steps.length - 1) { this.stop(); return; }
      this.goTo(this.idx + 1);
      this.timer = setTimeout(tick, this.delay());
    };
    this.timer = setTimeout(tick, this.delay());
  },
  stop() {
    this.playing = false;
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    this.syncButtons();
  },
  togglePlay() { this.playing ? this.stop() : this.play(); },
  stepFwd() { this.stop(); this.goTo(this.idx + 1); },
  stepBack() { this.stop(); this.goTo(this.idx - 1); },
  toStart() { this.stop(); this.goTo(0); },
  toEnd() { this.stop(); this.goTo(this.steps.length - 1); },
  syncButtons() {
    const c = this.controls;
    if (!c.play) return;
    c.play.textContent = this.playing ? '❚❚' : (this.idx >= this.steps.length - 1 && this.steps.length > 1 ? '↺' : '▶');
    c.play.setAttribute('aria-label', this.playing ? 'Pause' : 'Play');
    c.back.disabled = this.idx <= 0;
    c.start.disabled = this.idx <= 0;
    c.fwd.disabled = this.idx >= this.steps.length - 1;
    c.end.disabled = this.idx >= this.steps.length - 1;
  }
};

/* --- array-of-bars (sorting) --- */
function renderBars(state, el) {
  const a = state.a;
  const max = Math.max(...a.map(Math.abs), 1);
  const inRange = i => !state.range || (i >= state.range[0] && i <= state.range[1]);
  let html = '<div class="bars">';
  for (let i = 0; i < a.length; i++) {
    const cls = ['bar-slot'];
    if (state.done || (state.sorted || []).includes(i)) cls.push('sorted');
    else if ((state.swapped || []).includes(i)) cls.push('swapped');
    else if ((state.compare || []).includes(i)) cls.push('compare');
    else if (state.pivot === i) cls.push('pivot');
    if (state.range && !inRange(i) && !cls.includes('sorted')) cls.push('dim');
    else if (state.range && inRange(i)) cls.push('in-range');
    const h = Math.max(8, Math.round(Math.abs(a[i]) / max * 180));
    html += `<div class="${cls.join(' ')}"><div class="bar" style="height:${h}px"></div><div class="bar-val">${a[i]}</div></div>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

/* --- linked list --- */
function renderList(state, el) {
  const n = state.vals.length;
  const CW = 78, GAP = 34, X0 = 74, Y = 74;
  const W = X0 + n * (CW + GAP) + 10, H = 190;
  const cx = i => X0 + i * (CW + GAP);
  let defs = `<defs>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-pointer)"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-done)"/></marker>
  </defs>`;
  let cells = '', links = '', ptrs = '';

  // null slot on the far left (target of flipped links / prev=null)
  const nullX = 22;
  cells += `<text x="${nullX}" y="${Y + 22}" class="sv-small" font-size="16">∅</text>`;

  for (let i = 0; i < n; i++) {
    const x = cx(i);
    const isCurr = state.ptrs.curr === i;
    const isHead = state.newHead === i;
    cells += `<rect x="${x}" y="${Y - 22}" width="${CW}" height="44" rx="9" class="sv-cell${isCurr ? ' curr' : ''}${isHead ? ' newhead' : ''}"/>
      <line x1="${x + CW - 24}" y1="${Y - 22}" x2="${x + CW - 24}" y2="${Y + 22}" stroke="var(--line)" stroke-width="1.6"/>
      <text x="${x + (CW - 24) / 2}" y="${Y}" class="sv-label">${esc(state.vals[i])}</text>`;
    if (isHead) cells += `<text x="${x + CW / 2 - 12}" y="${Y - 32}" class="sv-ptr" fill="var(--c-done)">new head</text>`;

    const nx = state.next[i]; // node index, null, or undefined(=not yet defined)
    const px = x + CW - 12;   // centre of the pointer compartment
    if (nx === null) {
      links += `<text x="${px}" y="${Y + 2}" class="sv-small" font-size="13">∅</text>`;
    } else if (nx === i + 1) {
      links += `<circle cx="${px}" cy="${Y}" r="3" fill="var(--c-pointer)"/>
        <line x1="${px}" y1="${Y}" x2="${cx(nx) - 4}" y2="${Y}" class="sv-link" marker-end="url(#arrF)"/>`;
    } else {
      // flipped link — curve underneath back to the previous cell (or the ∅ slot)
      const tx = nx === -1 ? nullX + 6 : cx(nx) + CW - 6;
      const ty = Y + 26;
      links += `<circle cx="${px}" cy="${Y + 18}" r="3" fill="var(--c-done)"/>
        <path d="M ${px} ${Y + 18} C ${px} ${Y + 52}, ${tx + 24} ${Y + 56}, ${tx} ${ty + 6}" class="sv-link flipped" marker-end="url(#arrB)"/>`;
    }
  }

  // pointer chips
  const chip = (name, target, color, lane) => {
    const x = target === null ? nullX : cx(target) + (CW - 24) / 2;
    const y = Y + 66 + lane * 26;
    ptrs += `<line x1="${x}" y1="${Y + 26}" x2="${x}" y2="${y - 12}" stroke="${color}" stroke-width="1.4" stroke-dasharray="3 3"/>
      <text x="${x}" y="${y}" class="sv-ptr" fill="${color}">${name}</text>`;
  };
  const P = state.ptrs;
  if (P.prev !== undefined) chip('prev', P.prev, 'var(--c-done)', P.prev !== null && P.prev === P.curr ? 1 : 0);
  if (P.curr !== undefined && P.curr !== null) chip('curr', P.curr, 'var(--c-compare)', 0.55);
  else if (P.curr === null) chip('curr', null, 'var(--c-compare)', 0.55);
  if (P.next !== undefined) chip('next', P.next, 'var(--c-pointer)', 1.15);

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Linked list diagram">${defs}${links}${cells}${ptrs}</svg>`;
}

/* --- binary tree --- */
function renderTree(state, el) {
  const nodes = state.nodes;
  if (!nodes.length || state.root === null) { el.innerHTML = '<p class="sv-small">empty tree</p>'; return; }
  // layout: x = in-order rank, y = depth
  const pos = {};
  let rank = 0, maxDepth = 0;
  (function walk(id, depth) {
    if (id === null) return;
    walk(nodes[id].left, depth + 1);
    pos[id] = { r: rank++, d: depth };
    maxDepth = Math.max(maxDepth, depth);
    walk(nodes[id].right, depth + 1);
  })(state.root, 0);
  const XS = 64, YS = 74, PAD = 40;
  const W = PAD * 2 + Math.max(1, rank - 1) * XS;
  const H = PAD * 2 + maxDepth * YS + 10;
  const X = id => PAD + pos[id].r * XS;
  const Yp = id => PAD + pos[id].d * YS;
  let edges = '', circles = '';
  const visited = new Set(state.visited || []);
  for (let id = 0; id < nodes.length; id++) {
    if (!(id in pos)) continue;
    for (const kid of [nodes[id].left, nodes[id].right]) {
      if (kid !== null && kid in pos) {
        const active = state.current === kid && !state.settled;
        edges += `<line x1="${X(id)}" y1="${Yp(id)}" x2="${X(kid)}" y2="${Yp(kid)}" class="sv-edge${active ? ' active' : ''}"/>`;
      }
    }
  }
  for (const id in pos) {
    const i = Number(id);
    const cls = ['sv-node'];
    if (visited.has(i)) cls.push('visited');
    if (state.current === i) cls.push('current');
    circles += `<g class="${visited.has(i) ? 'visited' : ''}">
      <circle cx="${X(i)}" cy="${Yp(i)}" r="21" class="${cls.join(' ')}"/>
      <text x="${X(i)}" y="${Yp(i)}" class="sv-label">${esc(nodes[i].v)}</text></g>`;
  }
  let banner = '';
  if (state.pending !== undefined) {
    banner = `<text x="${PAD - 20}" y="18" class="sv-ptr" fill="var(--c-compare)" text-anchor="start">inserting ${esc(state.pending)}</text>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${Math.min(W, 640)}" role="img" aria-label="Binary search tree diagram">${edges}${circles}${banner}</svg>`;
}

/* --- graph --- */
function renderGraph(state, el) {
  const { nodes, edges } = state.graph;
  const N = nodes.length;
  const W = 460, H = 320, CX = W / 2, CY = H / 2 + 6;
  const RX = W / 2 - 50, RY = H / 2 - 44;
  const pos = {};
  nodes.forEach((n, i) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / N;
    pos[n] = { x: CX + RX * Math.cos(ang), y: CY + RY * Math.sin(ang) };
  });
  const visited = new Set(state.visited || []);
  const seen = new Set(state.seen || []);
  const tread = state.tread || [];
  const isTread = (u, v) => tread.some(([a, b]) => (a === u && b === v) || (a === v && b === u));
  const ae = state.activeEdge;
  let lines = '';
  for (const [u, v] of edges) {
    const active = ae && ((ae[0] === u && ae[1] === v) || (ae[0] === v && ae[1] === u));
    const cls = active ? 'sv-edge active' : (isTread(u, v) ? 'sv-edge tread' : 'sv-edge');
    lines += `<line x1="${pos[u].x}" y1="${pos[u].y}" x2="${pos[v].x}" y2="${pos[v].y}" class="${cls}"/>`;
  }
  let circles = '';
  for (const n of nodes) {
    const cls = ['sv-node'];
    if (visited.has(n)) cls.push('visited');
    else if (seen.has(n)) cls.push('seen');
    if (state.current === n) cls.push('current');
    circles += `<g class="${visited.has(n) ? 'visited' : ''}">
      <circle cx="${pos[n].x}" cy="${pos[n].y}" r="19" class="${cls.join(' ')}"/>
      <text x="${pos[n].x}" y="${pos[n].y}" class="sv-label">${esc(n)}</text></g>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="460" role="img" aria-label="Graph diagram">${lines}${circles}</svg>`;
}

/* ---------- Bubble Sort ---------- */
registerTopic({
  id: 'bubble-sort',
  category: 'Sorting Algorithms',
  title: 'Bubble Sort',
  tagline: 'Adjacent swaps until nothing moves',
  complexity: { best: 'O(n)', avg: 'O(n²)', worst: 'O(n²)', space: 'O(1)' },
  about: `<p>Bubble sort repeatedly walks the array, comparing each pair of neighbours and swapping
    them when they're out of order. After each pass the largest remaining value has "bubbled"
    to its final position on the right, so the unsorted region shrinks by one. If a whole pass
    finishes with no swaps, the array is sorted and the algorithm exits early.</p>`,
  uses: `<b>Where you'll meet it:</b> almost never in production — but it's the classic first sorting
    algorithm because every operation is visible. The early-exit trick makes it O(n) on
    already-sorted input, which is a nice intro to best-case analysis.`,
  code: [
    'function bubbleSort(a) {',
    '  const n = a.length;',
    '  for (let i = 0; i < n - 1; i++) {',
    '    let swapped = false;',
    '    for (let j = 0; j < n - 1 - i; j++) {',
    '      if (a[j] > a[j + 1]) {',
    '        swap(a, j, j + 1);',
    '        swapped = true;',
    '      }',
    '    }',
    '    if (!swapped) break;',
    '  }',
    '  return a;',
    '}'
  ],
  inputs: { kind: 'nums', label: 'Array', default: () => randomArray(8).join(', ') },
  renderer: renderBars,
  makeSteps(a0) {
    const a = a0.slice(), n = a.length, steps = [], sorted = [];
    const snap = (line, desc, extra = {}) =>
      steps.push({ line, desc, state: { a: a.slice(), sorted: sorted.slice(), ...extra } });
    snap(2, `Start with ${n} elements. Nothing is in its final place yet.`);
    for (let i = 0; i < n - 1; i++) {
      let swapped = false;
      snap(3, `Pass ${i + 1}: walk the unsorted region and bubble its largest value to the right.`);
      for (let j = 0; j < n - 1 - i; j++) {
        snap(6, `Compare a[${j}] = ${a[j]} with a[${j + 1}] = ${a[j + 1]}.`, { compare: [j, j + 1] });
        if (a[j] > a[j + 1]) {
          const x = a[j], y = a[j + 1];
          [a[j], a[j + 1]] = [a[j + 1], a[j]];
          snap(7, `${x} &gt; ${y}, so swap them.`, { swapped: [j, j + 1] });
          swapped = true;
        }
      }
      sorted.push(n - 1 - i);
      if (!swapped) {
        snap(11, 'No swaps in that whole pass — everything is already in order. Exit early.');
        break;
      }
      snap(5, `End of pass ${i + 1}: a[${n - 1 - i}] = ${a[n - 1 - i]} is locked into its final position.`);
    }
    snap(13, 'Done — the array is sorted.', { done: true });
    return steps;
  },
  quiz: [
    { q: 'What is the worst-case time complexity of bubble sort on n elements?',
      opts: ['O(n)', 'O(n log n)', 'O(n²)', 'O(2ⁿ)'], answer: 2,
      why: 'A reversed array forces a swap at nearly every comparison: about n passes of about n comparisons each, so O(n²).' },
    { q: 'Starting with [4, 2, 3, 1], what does the array look like after one full pass?',
      opts: ['[2, 3, 1, 4]', '[1, 2, 3, 4]', '[2, 4, 3, 1]', '[4, 2, 3, 1]'], answer: 0,
      why: '4 swaps rightward past 2, 3 and 1, ending in the last slot: [2, 3, 1, 4]. One pass only guarantees the largest value lands.' },
    { q: 'With the "swapped" early-exit flag, what is the best-case complexity — and when does it happen?',
      opts: ['O(1), on an empty array only', 'O(n), when the input is already sorted', 'O(n log n), on random input', 'O(n²) — the flag never helps'], answer: 1,
      why: 'On sorted input the first pass makes n−1 comparisons, no swaps, and the flag breaks the loop: linear time.' }
  ]
});

/* ---------- Merge Sort ---------- */
registerTopic({
  id: 'merge-sort',
  category: 'Sorting Algorithms',
  title: 'Merge Sort',
  tagline: 'Split in half, sort each half, merge',
  complexity: { best: 'O(n log n)', avg: 'O(n log n)', worst: 'O(n log n)', space: 'O(n)' },
  about: `<p>Merge sort is divide &amp; conquer: split the array in half, recursively sort each half,
    then <em>merge</em> the two sorted halves by repeatedly taking the smaller front element.
    The recursion is log n levels deep and each level does O(n) merging work, giving a
    guaranteed O(n log n) — no lucky or unlucky inputs.</p>`,
  uses: `<b>Where you'll meet it:</b> stable sorting in standard libraries (it never reorders equal
    elements), sorting linked lists, and external sorting of files too big for memory. The
    trade-off is the O(n) temporary buffer used while merging.`,
  code: [
    'function mergeSort(a, lo, hi) {',
    '  if (lo >= hi) return;',
    '  const mid = (lo + hi) >> 1;',
    '  mergeSort(a, lo, mid);',
    '  mergeSort(a, mid + 1, hi);',
    '  merge(a, lo, mid, hi);',
    '}',
    'function merge(a, lo, mid, hi) {',
    '  const tmp = [];',
    '  let i = lo, j = mid + 1;',
    '  while (i <= mid && j <= hi)',
    '    tmp.push(a[i] <= a[j] ? a[i++] : a[j++]);',
    '  while (i <= mid) tmp.push(a[i++]);',
    '  while (j <= hi) tmp.push(a[j++]);',
    '  for (let k = 0; k < tmp.length; k++)',
    '    a[lo + k] = tmp[k];',
    '}'
  ],
  inputs: { kind: 'nums', label: 'Array', default: () => randomArray(8).join(', ') },
  renderer: renderBars,
  makeSteps(a0) {
    const a = a0.slice(), steps = [];
    const snap = (line, desc, extra = {}) =>
      steps.push({ line, desc, state: { a: a.slice(), ...extra } });
    snap(1, 'Recursively split the array, then merge sorted halves back together.', { range: [0, a.length - 1] });
    (function ms(lo, hi) {
      if (lo >= hi) {
        snap(2, `[${lo}..${hi}] is a single element (${a[lo]}) — trivially sorted.`, { range: [lo, hi] });
        return;
      }
      const mid = (lo + hi) >> 1;
      snap(3, `Split [${lo}..${hi}] into [${lo}..${mid}] and [${mid + 1}..${hi}].`, { range: [lo, hi] });
      ms(lo, mid);
      ms(mid + 1, hi);
      snap(6, `Both halves of [${lo}..${hi}] are sorted — merge them.`, { range: [lo, hi] });
      const tmp = [];
      let i = lo, j = mid + 1;
      while (i <= mid && j <= hi) {
        snap(12, `Compare front elements ${a[i]} and ${a[j]} — take the smaller into the buffer.`, { range: [lo, hi], compare: [i, j] });
        tmp.push(a[i] <= a[j] ? a[i++] : a[j++]);
      }
      while (i <= mid) { snap(13, `Right half is exhausted — copy leftover ${a[i]} across.`, { range: [lo, hi], compare: [i] }); tmp.push(a[i++]); }
      while (j <= hi) { snap(14, `Left half is exhausted — copy leftover ${a[j]} across.`, { range: [lo, hi], compare: [j] }); tmp.push(a[j++]); }
      for (let k = 0; k < tmp.length; k++) {
        a[lo + k] = tmp[k];
        snap(16, `Write ${tmp[k]} back into position ${lo + k}.`, { range: [lo, hi], swapped: [lo + k] });
      }
    })(0, a.length - 1);
    snap(6, 'Final merge complete — the whole array is sorted.', { done: true });
    return steps;
  },
  quiz: [
    { q: 'What is merge sort’s time complexity in the worst case?',
      opts: ['O(n²)', 'O(n log n)', 'O(n)', 'O(log n)'], answer: 1,
      why: 'The array always splits into log n levels, and every level does O(n) merge work — no input can make it worse.' },
    { q: 'How much extra space does the classic array merge sort need?',

/* ---------- Quick Sort ---------- */
registerTopic({
  id: 'quick-sort',
  category: 'Sorting Algorithms',
  title: 'Quick Sort',
  tagline: 'Partition around a pivot, recurse on both sides',
  complexity: { best: 'O(n log n)', avg: 'O(n log n)', worst: 'O(n²)', space: 'O(log n)' },
  about: `<p>Quick sort picks a <em>pivot</em> (here: the last element) and partitions the range so
    everything smaller sits to the pivot's left and everything larger to its right. That drops
    the pivot into its final position, and the two sides are sorted recursively. On average the
    pivot splits the range roughly in half — O(n log n) — but a consistently terrible pivot
    (e.g. sorted input with a last-element pivot) degrades it to O(n²).</p>`,
  uses: `<b>Where you'll meet it:</b> the workhorse behind many standard-library sorts (usually as
    introsort — quick sort with safeguards). In-place, cache-friendly, and typically the fastest
    comparison sort in practice.`,
  code: [
    'function quickSort(a, lo, hi) {',
    '  if (lo >= hi) return;',
    '  const p = partition(a, lo, hi);',
    '  quickSort(a, lo, p - 1);',
    '  quickSort(a, p + 1, hi);',
    '}',
    'function partition(a, lo, hi) {',
    '  const pivot = a[hi];',
    '  let i = lo;',
    '  for (let j = lo; j < hi; j++) {',
    '    if (a[j] < pivot) {',
    '      swap(a, i, j);',
    '      i++;',
    '    }',
    '  }',
    '  swap(a, i, hi);',
    '  return i;',
    '}'
  ],
  inputs: { kind: 'nums', label: 'Array', default: () => randomArray(8).join(', ') },
  renderer: renderBars,
  makeSteps(a0) {
    const a = a0.slice(), steps = [], sorted = [];
    const snap = (line, desc, extra = {}) =>
      steps.push({ line, desc, state: { a: a.slice(), sorted: sorted.slice(), ...extra } });
    snap(1, 'Sort by partitioning each range around a pivot.', { range: [0, a.length - 1] });
    (function qs(lo, hi) {
      if (lo > hi) return;
      if (lo === hi) {
        sorted.push(lo);
        snap(2, `[${lo}..${hi}] is a single element (${a[lo]}) — it's already in place.`);
        return;
      }
      snap(8, `Partition [${lo}..${hi}]: choose the last element, a[${hi}] = ${a[hi]}, as pivot.`, { range: [lo, hi], pivot: hi });
      let i = lo;
      const pivotVal = a[hi];
      for (let j = lo; j < hi; j++) {
        snap(11, `Is a[${j}] = ${a[j]} smaller than pivot ${pivotVal}?`, { range: [lo, hi], pivot: hi, compare: [j] });
        if (a[j] < pivotVal) {
          if (i !== j) {
            const x = a[i], y = a[j];
            [a[i], a[j]] = [a[j], a[i]];
            snap(12, `Yes — swap ${y} and ${x} so ${y} joins the "smaller than pivot" zone.`, { range: [lo, hi], pivot: hi, swapped: [i, j] });
          } else {
            snap(13, `Yes — it's already at the zone boundary, just advance i.`, { range: [lo, hi], pivot: hi, compare: [j] });
          }
          i++;
        }
      }
      [a[i], a[hi]] = [a[hi], a[i]];
      sorted.push(i);
      snap(16, `Swap the pivot into the boundary: ${pivotVal} lands in its final position, index ${i}.`, { range: [lo, hi], swapped: [i, hi] });
      qs(lo, i - 1);
      qs(i + 1, hi);
    })(0, a.length - 1);
    snap(5, 'Every pivot has landed — the array is sorted.', { done: true });
    return steps;
  },
  quiz: [
    { q: 'What input makes last-element-pivot quick sort hit its O(n²) worst case?',
      opts: ['Random input', 'Already-sorted input', 'All values equal to zero', 'Input of odd length'], answer: 1,
      why: 'On sorted input the last element is always the maximum, so every partition splits into sizes n−1 and 0 — n levels of O(n) work.' },
    { q: 'What is guaranteed about the pivot immediately after one partition call?',
      opts: ['It is the median of the range', 'It sits in its final sorted position', 'It is the smallest element', 'Nothing until recursion finishes'], answer: 1,
      why: 'Partitioning puts all smaller values left of the pivot and all larger values right — exactly its place in the final order.' },
    { q: 'What is quick sort’s average-case time complexity?',
      opts: ['O(n)', 'O(n log n)', 'O(n²)', 'O(log n)'], answer: 1,
      why: 'On average the pivot splits ranges reasonably evenly, giving about log n levels of O(n) partitioning.' }
  ]
});

/* ---------- Linked List Reversal ---------- */
registerTopic({
  id: 'linked-list-reverse',
  category: 'Linked Lists',
  title: 'Reverse a Linked List',
  tagline: 'Three pointers walk the chain and flip every arrow',
  complexity: { best: 'O(n)', avg: 'O(n)', worst: 'O(n)', space: 'O(1)' },
  about: `<p>A singly linked list is a chain of nodes where each node stores a value and a pointer
    to the next node. To reverse it in place we walk the chain once with three pointers:
    <code>prev</code> (the reversed part built so far), <code>curr</code> (the node being
    flipped), and <code>next</code> (a bookmark saving the rest of the chain before we
    overwrite <code>curr.next</code>). Each iteration flips exactly one arrow.</p>`,
  uses: `<b>Where you'll meet it:</b> the single most-asked linked-list interview question, and the
    building block for problems like palindrome checking and reversing in k-groups. The
    save-before-you-overwrite pattern shows up in all pointer surgery.`,
  code: [
    'function reverseList(head) {',
    '  let prev = null;',
    '  let curr = head;',
    '  while (curr !== null) {',
    '    const next = curr.next;',
    '    curr.next = prev;',
    '    prev = curr;',
    '    curr = next;',
    '  }',
    '  return prev;',
    '}'
  ],
  inputs: { kind: 'nums', label: 'List values', default: () => '3, 8, 12, 5, 9', max: 7 },
  renderer: renderList,
  makeSteps(vals) {
    const n = vals.length, steps = [];
    const next = {};                       // node index -> index | null | -1 (∅ slot)
    for (let i = 0; i < n; i++) next[i] = i < n - 1 ? i + 1 : null;
    const ptrs = { prev: undefined, curr: undefined, next: undefined };
    let newHead;
    const snap = (line, desc) =>
      steps.push({ line, desc, state: { vals: vals.slice(), next: { ...next }, ptrs: { ...ptrs }, newHead } });
    const name = i => i === null ? 'null' : `node ${vals[i]}`;
    snap(2, 'prev starts at null — the reversed portion of the list is empty so far.');
    ptrs.prev = null;
    snap(3, 'curr starts at the head. next isn’t needed until the loop begins.');
    ptrs.curr = 0;
    snap(4, `Loop check: curr is ${name(ptrs.curr)}, not null — enter the loop.`);
    while (ptrs.curr !== null) {
      ptrs.next = next[ptrs.curr];
      snap(5, `Bookmark the rest of the chain: next = curr.next (${name(ptrs.next)}).`);
      next[ptrs.curr] = ptrs.prev === null ? -1 : ptrs.prev;
      snap(6, `Flip the arrow: ${name(ptrs.curr)} now points back to ${ptrs.prev === null ? '∅ (null)' : name(ptrs.prev)}.`);
      ptrs.prev = ptrs.curr;
      snap(7, `Advance prev to ${name(ptrs.prev)} — the reversed portion grew by one node.`);
      ptrs.curr = ptrs.next;
      ptrs.next = undefined;
      snap(8, `Advance curr to the bookmarked node (${name(ptrs.curr)}).`);
      snap(4, ptrs.curr === null
        ? 'Loop check: curr is null — every arrow has been flipped.'
        : `Loop check: curr is ${name(ptrs.curr)}, not null — flip another arrow.`);
    }
    newHead = ptrs.prev;
    snap(10, `Return prev — ${name(ptrs.prev)} is the head of the reversed list.`);
    return steps;
  },
  quiz: [
    { q: 'Why must next = curr.next be saved before setting curr.next = prev?',
      opts: ['To keep the loop O(1) per step', 'Overwriting curr.next first would lose the rest of the list', 'Because prev might be null', 'It is only needed for doubly linked lists'], answer: 1,
      why: 'curr.next is the only reference to the unvisited remainder of the chain. Overwrite it first and those nodes become unreachable.' },
    { q: 'What are the time and space complexities of iterative in-place reversal of n nodes?',
      opts: ['O(n) time, O(n) space', 'O(n²) time, O(1) space', 'O(n) time, O(1) space', 'O(log n) time, O(1) space'], answer: 2,
      why: 'One visit per node (O(n)) using only the three pointer variables (O(1)).' },
    { q: 'When the loop exits, which pointer holds the new head?',
      opts: ['curr', 'next', 'head', 'prev'], answer: 3,
      why: 'The loop ends when curr walks off the end (null). prev is then the last real node — the old tail, now the new head.' }
  ]
});

/* ---------- Binary Search Tree ---------- */
registerTopic({
  id: 'bst',
  category: 'Trees',
  title: 'Binary Search Tree',
  tagline: 'Ordered inserts, then an in-order walk',
  complexity: { best: 'O(log n)', avg: 'O(log n)', worst: 'O(n)', space: 'O(n)' },
  about: `<p>A binary search tree keeps an ordering invariant at every node: everything in the left
    subtree is smaller, everything in the right subtree is larger (ties here go right). Inserting
    or searching just follows comparisons down one path — O(log n) when the tree is balanced,
    but O(n) if inserts arrive in sorted order and the tree degenerates into a chain. An
    <em>in-order traversal</em> (left, node, right) visits the values in sorted order.</p>
    <p>This visualizer builds the tree from your values one insert at a time, then runs the
    in-order traversal.</p>`,
  uses: `<b>Where you'll meet it:</b> the concept behind ordered maps and sets (as self-balancing
    variants like AVL and red-black trees), database indexes, and any "keep data sorted while
    inserting" problem.`,
  code: [
    'function insert(root, v) {',
    '  if (root === null) return new Node(v);',
    '  if (v < root.val)',
    '    root.left = insert(root.left, v);',
    '  else',
    '    root.right = insert(root.right, v);',
    '  return root;',
    '}',
    'function inorder(node, out) {',
    '  if (node === null) return;',
    '  inorder(node.left, out);',
    '  out.push(node.val);',
    '  inorder(node.right, out);',
    '}'
  ],
  inputs: { kind: 'nums', label: 'Insert order', default: () => '50, 30, 70, 20, 40, 60, 80'.split(', ').sort(() => Math.random() - .5).join(', '), max: 10, allowDup: false },
  renderer: renderTree,
  makeSteps(vals) {
    const nodes = [];                       // {v, left, right} — ids are array indexes
    let root = null;
    const steps = [];
    const snap = (line, desc, extra = {}) =>
      steps.push({ line, desc, state: { nodes: JSON.parse(JSON.stringify(nodes)), root, ...extra } });
    for (const v of vals) {
      if (root === null) {
        nodes.push({ v, left: null, right: null });
        root = 0;
        snap(2, `insert(${v}): the tree is empty, so ${v} becomes the root.`, { current: root, settled: true });
        continue;
      }
      snap(1, `insert(${v}): start comparing at the root.`, { current: root, pending: v });
      let cur = root;
      for (;;) {
        const cv = nodes[cur].v;
        if (v < cv) {
          if (nodes[cur].left === null) {
            nodes.push({ v, left: null, right: null });
            nodes[cur].left = nodes.length - 1;
            snap(4, `${v} &lt; ${cv} and the left slot is free — attach ${v} as the left child of ${cv}.`, { current: nodes[cur].left, settled: true });
            break;
          }
          cur = nodes[cur].left;
          snap(4, `${v} &lt; ${cv} — descend left.`, { current: cur, pending: v });
        } else {
          if (nodes[cur].right === null) {
            nodes.push({ v, left: null, right: null });
            nodes[cur].right = nodes.length - 1;
            snap(6, `${v} ≥ ${cv} and the right slot is free — attach ${v} as the right child of ${cv}.`, { current: nodes[cur].right, settled: true });
            break;
          }
          cur = nodes[cur].right;
          snap(6, `${v} ≥ ${cv} — descend right.`, { current: cur, pending: v });
        }
      }
    }
    // in-order traversal
    const out = [], visited = [];
    const auxOf = () => `output: <b>[${out.join(', ')}]</b>`;
    snap(9, 'The tree is built. Now walk it in-order: left subtree, node, right subtree.', { visited: [], aux: auxOf() });
    (function walk(id) {
      if (id === null) return;
      if (nodes[id].left !== null) {
        snap(11, `At ${nodes[id].v}: recurse into the left subtree first.`, { current: id, visited: visited.slice(), aux: auxOf() });
      }
      walk(nodes[id].left);
      out.push(nodes[id].v);
      visited.push(id);
      snap(12, `Visit ${nodes[id].v} — append it to the output.`, { current: id, visited: visited.slice(), aux: auxOf() });
      if (nodes[id].right !== null) {
        snap(13, `At ${nodes[id].v}: now recurse into the right subtree.`, { current: id, visited: visited.slice(), aux: auxOf() });
      }
      walk(nodes[id].right);
    })(root);
    snap(9, `Traversal complete — in-order output is sorted: [${out.join(', ')}].`, { visited: visited.slice(), aux: auxOf() });
    return steps;
  },
  quiz: [
    { q: 'What does an in-order traversal of a binary search tree produce?',
      opts: ['Values in insertion order', 'Values in sorted order', 'Values level by level', 'A random permutation'], answer: 1,
      why: 'Left subtree (all smaller) → node → right subtree (all larger). Applied recursively, that is exactly ascending order.' },
    { q: 'Inserting 1, 2, 3, 4, 5 in that order into an empty BST produces what shape — and what search cost?',
      opts: ['A perfectly balanced tree, O(log n)', 'A right-leaning chain, O(n)', 'A left-leaning chain, O(log n)', 'It depends on the values, not the order'], answer: 1,
      why: 'Each new value is the largest so far, so it always goes right: the tree degenerates into a linked list with O(n) search.' },
    { q: 'What is the average-case cost of search in a BST built from randomly ordered inserts?',
      opts: ['O(1)', 'O(log n)', 'O(n)', 'O(n log n)'], answer: 1,
      why: 'Random insert order keeps the expected height logarithmic, and search follows a single root-to-leaf path.' }
  ]
});

/* ---------- BFS ---------- */
registerTopic({
  id: 'bfs',
  category: 'Graphs',
  title: 'Breadth-First Search',
  tagline: 'Explore in rings, powered by a queue',
  complexity: { best: 'O(V + E)', avg: 'O(V + E)', worst: 'O(V + E)', space: 'O(V)' },
  about: `<p>BFS explores a graph in expanding "rings" from the start node: first all neighbours at
    distance 1, then distance 2, and so on. A <em>queue</em> (first-in, first-out) enforces that
    order — newly discovered nodes join the back of the line. Because nodes are reached in
    distance order, BFS finds shortest paths in unweighted graphs.</p>
    <p>Dashed nodes are <em>discovered</em> (in the queue); filled nodes are <em>visited</em>.</p>`,
  uses: `<b>Where you'll meet it:</b> shortest path in unweighted graphs (mazes, word ladders, social
    "degrees of separation"), level-order tree traversal, web crawling, and connectivity checks.`,
  code: [
    'function bfs(graph, start) {',
    '  const queue = [start];',
    '  const visited = new Set([start]);',
    '  while (queue.length > 0) {',
    '    const node = queue.shift();',
    '    visit(node);',
    '    for (const next of graph[node]) {',
    '      if (!visited.has(next)) {',
    '        visited.add(next);',
    '        queue.push(next);',
    '      }',
    '    }',
    '  }',
    '}'
  ],
  inputs: { kind: 'graph', label: 'Edges', default: () => 'A-B, A-C, B-D, C-D, C-E, D-F, E-F', startDefault: 'A' },
  renderer: renderGraph,
  makeSteps({ graph, start }) {
    const steps = [];
    const seen = new Set([start]);
    const visited = [], queue = [start], tread = [];
    const snap = (line, desc, extra = {}) =>
      steps.push({ line, desc, state: {
        graph, visited: visited.slice(), seen: [...seen], tread: tread.slice(),
        aux: `queue (front → back): <b>[${queue.join(', ')}]</b>`, ...extra
      } });
    snap(2, `Seed the queue with the start node ${start}.`);
    snap(3, `Mark ${start} as discovered so it can never be queued twice.`);
    while (queue.length > 0) {
      const node = queue.shift();
      snap(5, `Dequeue ${node} from the front of the queue.`, { current: node });
      visited.push(node);
      snap(6, `Visit ${node}.`, { current: node });
      for (const nb of graph.adj[node]) {
        snap(7, `Look at ${node}'s neighbour ${nb}.`, { current: node, activeEdge: [node, nb] });
        if (!seen.has(nb)) {
          seen.add(nb);
          queue.push(nb);
          tread.push([node, nb]);
          snap(10, `${nb} is new — mark it discovered and enqueue it at the back.`, { current: node, activeEdge: [node, nb] });
        } else {
          snap(8, `${nb} was already discovered — skip it.`, { current: node, activeEdge: [node, nb] });
        }
      }
    }
    snap(13, 'The queue is empty — every reachable node has been visited, in order of distance from the start.', {});
    return steps;
  },
  quiz: [
    { q: 'Which data structure gives BFS its level-by-level exploration order?',
      opts: ['A stack (LIFO)', 'A queue (FIFO)', 'A priority queue', 'A hash map'], answer: 1,
      why: 'First-in, first-out means nodes are processed in the order discovered — all of distance k before any of distance k+1.' },
    { q: 'In an unweighted graph, what does BFS from node S guarantee about the first time it reaches node T?',
      opts: ['It used the fewest possible edges from S to T', 'It used the alphabetically smallest path', 'Nothing — DFS is needed for shortest paths', 'It visited every other node first'], answer: 0,
      why: 'BFS reaches nodes in increasing distance order, so the first arrival at T is via a shortest (fewest-edges) path.' },
    { q: 'What is the time complexity of BFS with an adjacency list, for V vertices and E edges?',
      opts: ['O(V²) always', 'O(V + E)', 'O(E log V)', 'O(V · E)'], answer: 1,
      why: 'Each vertex is enqueued once and each edge is examined a constant number of times: O(V + E).' }
  ]
});

  about: `<p>DFS commits to one path and follows it as deep as possible, only backtracking when it
    runs out of unvisited neighbours. The recursion call stack (or an explicit stack) remembers
    the path back. Compare it with BFS on the same graph: DFS snakes into the graph; BFS ripples
    outward.</p>
    <p>The strip under the diagram shows the live call stack — watch it grow on each dive and
    shrink on each backtrack.</p>`,
  uses: `<b>Where you'll meet it:</b> cycle detection, topological sorting, maze generation and
    solving, connected components, and as the skeleton of backtracking algorithms like N-Queens.`,
  code: [
    'function dfs(graph, node, visited) {',
    '  visited.add(node);',
    '  visit(node);',
    '  for (const next of graph[node]) {',
    '    if (!visited.has(next)) {',
    '      dfs(graph, next, visited);',
    '    }',
    '  }',
    '}'
  ],
  inputs: { kind: 'graph', label: 'Edges', default: () => 'A-B, A-C, B-D, C-D, C-E, D-F, E-F', startDefault: 'A' },
  renderer: renderGraph,
  makeSteps({ graph, start }) {
    const steps = [];
    const seen = new Set();
    const visited = [], stack = [], tread = [];
    const snap = (line, desc, extra = {}) =>
      steps.push({ line, desc, state: {
        graph, visited: visited.slice(), seen: [...seen], tread: tread.slice(),
        aux: `call stack (bottom → top): <b>[${stack.join(', ')}]</b>`, ...extra
      } });
    (function go(node, from) {
      stack.push(node);
      seen.add(node);
      visited.push(node);
      if (from) tread.push([from, node]);
      snap(2, `Mark ${node} visited — the call stack is now ${stack.length} deep.`, { current: node });
      snap(3, `Visit ${node}.`, { current: node });
      for (const nb of graph.adj[node]) {
        snap(5, `From ${node}, check neighbour ${nb}.`, { current: node, activeEdge: [node, nb] });

          snap(4, `Backtrack to ${node} and continue with its remaining neighbours.`, { current: node });
        }
      }
      stack.pop();
    })(start, null);
    snap(8, `Every path from ${start} has been fully explored — the stack unwinds to empty.`, {});
    return steps;
  },
  quiz: [
    { q: 'What plays the role of BFS’s queue in a depth-first search?',
      opts: ['A priority queue', 'A second graph', 'The call stack (or an explicit stack)', 'A sorted list'], answer: 2,
      why: 'LIFO order is what makes the search dive: the most recently discovered node is explored next, and the stack remembers the way back.' },

    { q: 'What is the worst-case extra space DFS needs on a graph with V vertices?',

  ]
});

/* ================================================================
   Progress
   ================================================================ */
function isDone(id) { return !!Store.data.done[id]; }
function setDone(id, val) {
  if (val) Store.data.done[id] = true; else delete Store.data.done[id];
  Store.save();
  paintProgress();
  buildSidebar();
}
function paintProgress() {
  const total = Topics.length;
  const done = Topics.filter(t => isDone(t.id)).length;
  $('#progressPill').innerHTML = `<b>${done}</b> / ${total} topics completed`;
}

/* ================================================================
   Sidebar
   ================================================================ */
let activeTopicId = null;

function buildSidebar() {
  const nav = $('#sidebar');
  let html = '';
  for (const cat of CATEGORIES) {
    const real = Topics.filter(t => t.category === cat);
    const planned = PLANNED[cat] || [];
    if (!real.length && !planned.length) continue;
    html += `<div class="nav-cat">${esc(cat)}</div>`;
    for (const t of real) {
      html += `<button class="nav-item${t.id === activeTopicId ? ' active' : ''}" data-topic="${t.id}">
        ${esc(t.title)}${isDone(t.id) ? '<span class="check" aria-label="completed">✓</span>' : ''}</button>`;
    }
    for (const p of planned) {
      html += `<div class="nav-item planned" aria-disabled="true">${esc(p)}<span class="soon">soon</span></div>`;
    }
  }
  nav.innerHTML = html;
  nav.querySelectorAll('[data-topic]').forEach(btn => {
    btn.addEventListener('click', () => {
      openTopic(btn.dataset.topic);
      closeDrawer();
    });
  });
}

function openDrawer() { $('#sidebar').classList.add('open'); $('#backdrop').classList.add('show'); }
function closeDrawer() { $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('show'); }

/* ================================================================
   Topic view
   ================================================================ */
function openTopic(id) {
  const t = TopicById[id];
  if (!t) return;
  activeTopicId = id;
  Player.stop();
  buildSidebar();

  const main = $('#main');
  const cx = t.complexity;
  const legendFor = {
    [String(renderBars)]: [['--c-compare', 'comparing'], ['--c-active', 'writing / swapping'], ['--c-pivot', 'pivot'], ['--c-done', 'sorted'], ['--c-pointer', 'unsorted']],
    [String(renderList)]: [['--c-compare', 'curr'], ['--c-done', 'prev / flipped link'], ['--c-pointer', 'next / forward link']],
    [String(renderTree)]: [['--c-compare', 'current node'], ['--c-done', 'visited']],
    [String(renderGraph)]: [['--c-compare', 'current / edge in use'], ['--c-pointer', 'discovered (queued)'], ['--c-done', 'visited']]
  }[String(t.renderer)] || [];

  main.innerHTML = `
    <div class="crumb">${esc(t.category)}</div>
    <div class="topic-head">
      <h1>${esc(t.title)}</h1>
      <button class="done-btn" id="doneBtn"></button>
    </div>
    <div class="chips">
      <span class="chip"><span>best</span> ${cx.best}</span>
      <span class="chip"><span>average</span> ${cx.avg}</span>
      <span class="chip"><span>worst</span> ${cx.worst}</span>
      <span class="chip"><span>space</span> ${cx.space}</span>
    </div>
    <div class="about">${t.about}<p class="uses">${t.uses}</p></div>

    <div class="bench">
      <section class="card viz-card" aria-label="Visualizer">
        <div class="card-h">Visualizer <span style="margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0">${esc(t.tagline)}</span></div>
        <div class="input-row" id="inputRow"></div>
        <div class="legend">${legendFor.map(([v, l]) => `<span><i style="background:var(${v})"></i>${l}</span>`).join('')}</div>
        <div class="stage" id="stage"></div>
        <div class="aux-strip" id="aux"></div>
        <div class="narrate" id="narrate"></div>
        <div class="transport">
          <button class="t-btn" id="tStart" aria-label="Back to start">⏮</button>
          <button class="t-btn" id="tBack" aria-label="Step back">⏴</button>
          <button class="t-btn play" id="tPlay" aria-label="Play">▶</button>
          <button class="t-btn" id="tFwd" aria-label="Step forward">⏵</button>
          <button class="t-btn" id="tEnd" aria-label="Skip to end">⏭</button>
          <div class="speed-wrap"><span>slow</span><input type="range" id="tSpeed" min="1" max="10" value="5" aria-label="Animation speed"><span>fast</span></div>
          <span class="step-count" id="tCount"></span>
        </div>
      </section>

      <section class="card code-card" aria-label="Code">
        <div class="card-h">JavaScript — executing line highlighted</div>
        <div class="code-body" id="codeBody">
          ${t.code.map((line, i) => `<div class="code-line"><span class="ln">${i + 1}</span><span>${esc(line) || ' '}</span></div>`).join('')}
        </div>
      </section>
    </div>

    <section class="card quiz" aria-label="Quiz" id="quizCard"></section>
  `;

  // done button
  const doneBtn = $('#doneBtn');
  const paintDone = () => {
    doneBtn.textContent = isDone(id) ? '✓ Completed' : 'Mark as complete';
    doneBtn.classList.toggle('on', isDone(id));
  };
  doneBtn.addEventListener('click', () => { setDone(id, !isDone(id)); paintDone(); });
  paintDone();

  // wire player
  Player.stageEl = $('#stage');
  Player.codeEl = $('#codeBody');
  Player.narrateEl = $('#narrate');
  Player.auxEl = $('#aux');
  Player.countEl = $('#tCount');
  Player.controls = {
    start: $('#tStart'), back: $('#tBack'), play: $('#tPlay'),
    fwd: $('#tFwd'), end: $('#tEnd'), speed: $('#tSpeed')
  };
  $('#tStart').addEventListener('click', () => Player.toStart());
  $('#tBack').addEventListener('click', () => Player.stepBack());
  $('#tPlay').addEventListener('click', () => Player.togglePlay());
  $('#tFwd').addEventListener('click', () => Player.stepFwd());
  $('#tEnd').addEventListener('click', () => Player.toEnd());

  buildInputRow(t);
  runTopic(t);
  buildQuiz(t);
  window.scrollTo({ top: 0 });
}

/* ---------------- custom input row ---------------- */
function buildInputRow(t) {
  const row = $('#inputRow');
  const spec = t.inputs;
  if (spec.kind === 'nums') {
    row.innerHTML = `
      <label for="inMain">${esc(spec.label)}</label>
      <input type="text" id="inMain" value="${esc(spec.default())}" spellcheck="false" aria-label="${esc(spec.label)}">
      <button class="shuffle-btn" id="inShuffle" title="Random values">🎲</button>
      <button class="run-btn" id="inRun">Run</button>
      <div class="input-err" id="inErr"></div>`;
    $('#inShuffle').addEventListener('click', () => {
      $('#inMain').value = randomArray(spec.max ? Math.min(8, spec.max) : 8).join(', ');
      runTopic(t);
    });
  } else if (spec.kind === 'graph') {
    row.innerHTML = `
      <label for="inMain">${esc(spec.label)}</label>
      <input type="text" id="inMain" value="${esc(spec.default())}" spellcheck="false" aria-label="Graph edges">
      <label for="inStart">Start</label>
      <input type="text" id="inStart" value="${esc(spec.startDefault)}" spellcheck="false" style="flex:0 0 64px;min-width:64px" aria-label="Start node">
      <button class="run-btn" id="inRun">Run</button>
      <div class="input-err" id="inErr"></div>`;
  }
  $('#inRun').addEventListener('click', () => runTopic(t));
  row.querySelectorAll('input[type=text]').forEach(inp =>
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') runTopic(t); }));
}

function runTopic(t) {
  const err = $('#inErr');
  err.classList.remove('show');
  try {
    let parsed;
    if (t.inputs.kind === 'nums') {
      parsed = parseNums($('#inMain').value, { max: t.inputs.max || 12, allowDup: t.inputs.allowDup !== false });
    } else if (t.inputs.kind === 'graph') {
      const graph = parseGraph($('#inMain').value);
      const start = $('#inStart').value.trim().toUpperCase();
      if (!graph.adj[start]) throw new Error(`Start node "${start || '?'}" isn't in the graph. Nodes: ${graph.nodes.join(', ')}.`);
      parsed = { graph, start };
    }
    Player.load(t.makeSteps(parsed), t.renderer);
  } catch (e) {
    err.textContent = e.message;
    err.classList.add('show');
  }
}

/* ---------------- quiz ---------------- */
function buildQuiz(t) {
  const card = $('#quizCard');
  const picks = new Array(t.quiz.length).fill(null);

  const paint = () => {
    const answered = picks.filter(p => p !== null).length;
    const correct = picks.filter((p, i) => p === t.quiz[i].answer).length;
    const allRight = correct === t.quiz.length;
    card.innerHTML = `
      <div class="card-h"><span class="qt">Check your understanding</span>
        <span class="quiz-score${allRight ? ' pass' : ''}">${allRight ? '🎉 All correct — topic complete!' : `${correct} / ${t.quiz.length} correct`}</span></div>
      ${t.quiz.map((q, qi) => `
        <div class="q-block">
          <div class="q-text">${qi + 1}. ${q.q}</div>
          <div class="q-opts">
            ${q.opts.map((o, oi) => {
              const cls = ['q-opt'];
              if (picks[qi] !== null) {
                if (oi === q.answer) cls.push('correct');
                else if (oi === picks[qi]) cls.push('wrong');
              }
              return `<button class="${cls.join(' ')}" data-q="${qi}" data-o="${oi}" ${picks[qi] !== null ? 'disabled' : ''}>${esc(o)}</button>`;
            }).join('')}
          </div>
          <div class="q-explain${picks[qi] !== null ? ' show' : ''}">${q.why}</div>
        </div>`).join('')}
      <button class="quiz-reset" id="quizReset">Reset quiz</button>`;
    card.querySelectorAll('.q-opt:not(:disabled)').forEach(btn => {
      btn.addEventListener('click', () => {
        picks[Number(btn.dataset.q)] = Number(btn.dataset.o);
        const nowCorrect = picks.filter((p, i) => p === t.quiz[i].answer).length;
        if (nowCorrect === t.quiz.length) setDone(t.id, true);
        paint();
      });
    });
    $('#quizReset').addEventListener('click', () => { picks.fill(null); paint(); });
    if (answered) { /* keep scroll position stable */ }
  };
  paint();
}

   Welcome view + boot

  $('#main').innerHTML = `
    <div class="welcome">
      <div class="crumb">Welcome</div>

        <em>run, pause, and rewind</em>. Pick a topic from the menu to get:</p>

        <li><b>Your own data</b> — type in any array, list, or graph and watch the algorithm chew on it.</li>
        <li><b>The essentials</b> — what it does, Big-O time &amp; space, and where it shows up in the real world.</li>

      <p>Start with <b>Bubble Sort</b> for the gentlest introduction, or jump straight to

$('#themeBtn').addEventListener('click', toggleTheme);
$('#menuBtn').addEventListener('click', openDrawer);
$('#backdrop').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === ' ') { e.preventDefault(); Player.togglePlay(); }
  else if (e.key === 'ArrowRight') Player.stepFwd();
  else if (e.key === 'ArrowLeft') Player.stepBack();
});

paintProgress();
showWelcome();
</script>
