<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Ticker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Crypto Ticker</h1>
    <div class="controls">
      <span id="last-updated">Fetching prices...</span>
      <button id="refresh-btn" onclick="fetchPrices()">&#8635; Refresh</button>
    </div>
  </header>

  <div class="ticker-banner">
    <div class="ticker-track" id="ticker-track">Loading...</div>
  </div>

  <main>
    <div class="search-bar">
      <input type="text" id="search" placeholder="Search coins..." oninput="filterCoins()" />
    </div>

    <div class="grid" id="coin-grid"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
