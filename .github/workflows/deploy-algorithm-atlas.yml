name: Deploy Algorithm Atlas

# Builds the static export and publishes it to GitHub Pages.
# Requires Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [claude/dsa-learning-app-8jtbun, main]
    paths: ["dsa-learning-app/**", ".github/workflows/deploy-algorithm-atlas.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsa-learning-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsa-learning-app/package-lock.json

      - run: npm ci

      - name: Build static export
        # Pages serves project sites from /<repo>, so the app needs that base path.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dsa-learning-app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
